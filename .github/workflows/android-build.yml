name: Android web bundle

on:
  push:
    branches:
      - feature/android-capacitor
  pull_request:
    branches:
      - backup/pre-android-2026-11-10

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build static web bundle for Capacitor
        run: npm run build:web
      - name: Upload static bundle
        uses: actions/upload-artifact@v4
        with:
          name: islam-a-lorigine-android-web
          path: out/
          if-no-files-found: error
          retention-days: 7
